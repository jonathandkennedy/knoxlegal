<script>
(function(){
  "use strict";
  /* ---------------------------------------------------------------
     FORM_ENDPOINT: where leads are POSTed as JSON (Formspree).
     Set to "" to QA the flow without sending anything.
  ----------------------------------------------------------------*/
  var FORM_ENDPOINT = "https://formspree.io/f/xgaezppb";

  window.dataLayer = window.dataLayer || [];
  function track(ev, extra){
    var payload = Object.assign({event: ev, lp_page: "{{SLUG}}"}, extra || {});
    if (window.__lp_kw) payload.lp_kw = window.__lp_kw;
    window.dataLayer.push(payload);
  }

  /* ---------------------------------------------------------------
     Whitelisted dynamic keyword insertion.
     Ads append the bidded keyword via a Final URL suffix
     (kw={keyword:probate} — see google-ads/keywords.md). The page
     matches it against DKI.rules (first match wins) and swaps the
     hero headline/lead to a PRE-WRITTEN variant. Unrecognized
     keywords change nothing, and raw URL text is never rendered —
     so junk queries can't put junk on the page.
  ----------------------------------------------------------------*/
  var DKI = {{DKI_JSON}};
  (function(){
    try{
      var kw = new URLSearchParams(location.search).get("kw");
      if (!kw || !DKI || !DKI.rules) return;
      kw = decodeURIComponent(kw).replace(/\+/g, " ").toLowerCase();
      window.__lp_kw = kw.slice(0, 80);
      var variant = null;
      for (var i = 0; i < DKI.rules.length; i++){
        if (kw.indexOf(DKI.rules[i][0]) !== -1){
          variant = DKI.variants[DKI.rules[i][1]];
          break;
        }
      }
      if (!variant) return;
      var h1 = document.querySelector(".hero h1");
      if (h1 && variant.h1) h1.textContent = variant.h1;
      var lead = document.querySelector(".hero .lead");
      if (lead && variant.lead) lead.textContent = variant.lead;
      track("lp_dki_applied", {dki_variant: variant.h1});
    }catch(e){}
  })();

  document.querySelectorAll(".js-call").forEach(function(a){
    a.addEventListener("click", function(){ track("lp_call_click"); });
  });

  function send(data, done, fail){
    if (!FORM_ENDPOINT){ done(); return; } // QA mode
    data._subject = "Knox Law " + (data.lead_type === "planning" ? "planning" : "PROBATE")
      + " lead — " + data.lp_page;
    fetch(FORM_ENDPOINT, {
      method: "POST",
      headers: {"Content-Type": "application/json", "Accept": "application/json"},
      body: JSON.stringify(data)
    }).then(function(r){ if (r.ok) done(); else fail(); }).catch(fail);
  }

  /* ---------- case-review wizard: one question at a time ---------- */
  var form = document.getElementById("lead-form");
  if (form){
    var answers  = {};
    var steps    = form.querySelectorAll(".wiz-step");
    var fill     = document.getElementById("wiz-fill");
    var label    = document.getElementById("wiz-label");
    var backBtn  = document.getElementById("wiz-back");
    var planNote = document.getElementById("planning-note");
    var legend3  = document.getElementById("contact-legend");
    var submitBtn = document.getElementById("wiz-submit");
    var defaultSubmit = submitBtn.textContent;
    var thanks   = document.getElementById("thanks-msg");
    var detail   = document.getElementById("thanks-detail");
    var errBox   = document.getElementById("form-error");
    var current  = 1, started = false;

    // Planning visitors are welcomed, not turned away — their lead is simply
    // tagged separately so it never counts as a probate ad conversion. They
    // skip the estate question (there's no estate) and go straight to contact.
    function isPlanning(){ return answers.situation === "planning"; }
    function total(){ return isPlanning() ? 2 : 3; }
    function shown(step){ return (isPlanning() && step === 3) ? 2 : step; }

    function show(step){
      current = step;
      for (var i = 0; i < steps.length; i++){
        steps[i].hidden = (parseInt(steps[i].getAttribute("data-step"), 10) !== step);
      }
      backBtn.hidden = (step === 1);
      label.textContent = "Question " + shown(step) + " of " + total();
      fill.style.width = Math.round(100 * shown(step) / total()) + "%";
      planNote.style.display = (step === 3 && isPlanning()) ? "block" : "none";
      if (step === 3){
        legend3.textContent = isPlanning()
          ? "Where should the firm reach you about planning?"
          : "Last step — where should we send your case review?";
        submitBtn.textContent = isPlanning()
          ? "Request a Planning Conversation" : defaultSubmit;
      }
    }

    form.addEventListener("click", function(e){
      var opt = e.target.closest(".opt");
      if (!opt) return;
      answers[opt.getAttribute("data-q")] = opt.getAttribute("data-v");
      if (!started){ started = true; track("lp_form_start"); }
      if (opt.getAttribute("data-q") === "situation"){
        if (isPlanning()){ track("lp_planning_interest"); show(3); }
        else show(2);
      } else {
        show(3);
      }
    });

    backBtn.addEventListener("click", function(){
      errBox.style.display = "none";
      if (current === 3) show(isPlanning() ? 1 : 2);
      else show(1);
    });

    form.addEventListener("submit", function(e){
      e.preventDefault();
      errBox.style.display = "none";
      if (form.company && form.company.value) return; // honeypot

      var name  = document.getElementById("name").value.trim();
      var phone = document.getElementById("phone").value.trim();
      if (!answers.situation || !name || !phone){
        errBox.style.display = "block";
        return;
      }

      var planning = isPlanning();
      var data = {
        situation: answers.situation,
        real_estate: answers.real_estate || "",
        lead_type: planning ? "planning" : "probate",
        name: name,
        phone: phone,
        email: document.getElementById("email").value.trim(),
        lp_page: "{{SLUG}}",
        lp_kw: window.__lp_kw || ""
      };

      send(data, function(){
        form.style.display = "none";
        label.style.display = "none";
        fill.style.width = "100%";
        detail.textContent = planning
          ? "The firm will reach out about wills, trusts, and planning ahead."
          : "The firm will review the estate details and reach out shortly.";
        thanks.style.display = "block";
        track(planning ? "lp_planning_submit" : "lp_form_submit",
              {lead_type: data.situation, real_estate: data.real_estate});
      }, function(){
        errBox.textContent = "Something went wrong sending your request. Please call us at {{PHONE_DISPLAY}}.";
        errBox.style.display = "block";
      });
    });

    show(1);
  }

  /* ---------- planning page mini form ---------- */
  var pform = document.getElementById("planning-form");
  if (pform){
    pform.addEventListener("submit", function(e){
      e.preventDefault();
      var perr = document.getElementById("p-error");
      perr.style.display = "none";
      if (pform.company && pform.company.value) return;
      var name  = document.getElementById("p-name").value.trim();
      var phone = document.getElementById("p-phone").value.trim();
      if (!name || !phone){ perr.style.display = "block"; return; }
      var data = {
        lead_type: "planning",
        interest: document.getElementById("p-interest").value,
        name: name, phone: phone,
        email: document.getElementById("p-email").value.trim(),
        lp_page: "{{SLUG}}"
      };
      send(data, function(){
        pform.style.display = "none";
        document.getElementById("p-thanks").style.display = "block";
        track("lp_planning_submit", {interest: data.interest});
      }, function(){
        perr.textContent = "Something went wrong — please reach the firm at knoxlegal.com.";
        perr.style.display = "block";
      });
    });
  }
})();
</script>
